<!DOCTYPE html>
<html lang="vi" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hàng đợi phê duyệt - CivicGuide</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <style>
        /* CSS riêng cho việc so sánh 2 phiên bản */
        .diff-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .diff-container { grid-template-columns: 1fr; }
        }
        .diff-card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 20px;
        }
        .diff-card.current { border-top: 4px solid #cbd5e1; }
        .diff-card.proposed { border-top: 4px solid #3b82f6; background: #f8fafc; }
        :root[data-theme=dark] .diff-card.proposed { background: #1e293b; }

        .diff-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
        }
        .diff-title { font-size: 16px; font-weight: 700; color: var(--navy); }
        :root[data-theme=dark] .diff-title { color: var(--text); }
        .diff-date { font-size: 11.5px; color: var(--muted); }

        .diff-list { list-style: none; padding: 0; margin: 0 0 16px 0; }
        .diff-list li { font-size: 12.5px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
        .diff-list li:last-child { border-bottom: 0; }
        .diff-list li.added { color: #1e7a4a; font-weight: 600; background: #d3f0e0; padding: 8px; border-radius: 4px; }
        .diff-list li.removed { color: #c23030; text-decoration: line-through; }

        .diff-meta {
            font-size: 12px;
            background: var(--bg);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .diff-meta p { margin-bottom: 4px; }
        .diff-meta p:last-child { margin-bottom: 0; }
        
        .danger-risk { color: #c23030; font-weight: 700; font-size: 11px; text-transform: uppercase; }
    </style>
</head>
<body data-role="editor" data-page="editor-approval-queue" data-base="../../">
    
    <div id="app-header"></div>
    
    <div class="app-layout">
        <div id="app-sidebar"></div>
        
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1>Hàng đợi phê duyệt cập nhật</h1>
                    <p class="text-muted">Xem xét thay đổi nguồn, so sánh các phiên bản checklist trước khi xuất bản.</p>
                </div>
                <span class="badge" style="background:#e3f1fb;color:#1b8de6;padding:8px 16px;font-size:13px;" id="queue-count">Đang tải...</span>
            </header>

            <!-- Khu vực so sánh (Sẽ được JS render) -->
            <div id="approval-list">
                <div class="card" style="text-align:center; padding: 40px; color: var(--muted);">
                    Đang tải dữ liệu hàng đợi...
                </div>
            </div>
        </main>
    </div>
    
    <div id="app-toast"></div>
    
    <!-- Thư viện dùng chung -->
    <script src="../../js/api.js"></script>
    <script src="../../js/ui-components.js"></script>
    <script src="../../js/main.js"></script>
    
    <!-- JS riêng cho trang này -->
    <script src="../../js/modules/editor-approval-queue.js"></script>
</body>
</html>
